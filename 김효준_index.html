<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 먹거리·특산물</title>
<style>
:root{--bg:#fff8ee;--card:#fff;--ink:#2b2118;--sub:#7a6a5a;--main:#f58a1f;--main-d:#d46f0a;--line:#f0e2cf;--like:#2f7de1}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#ffb347,#f58a1f);color:#fff;padding:36px 16px 28px;text-align:center}
header h1{margin:0 0 6px;font-size:28px}
header p{margin:0;opacity:.95}
main{max-width:1080px;margin:0 auto;padding:16px}
.sec-title{font-size:18px;margin:8px 0}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:8px}
.cat-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--ink);text-decoration:none;transition:transform .12s,box-shadow .12s;display:block}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(245,138,31,.18);border-color:var(--main)}
.cat-card .ico{font-size:36px;display:block;margin-bottom:8px}
.cat-card b{display:block;font-size:18px}
.cat-card .n{color:var(--sub);font-size:13px}
.cat-card.wish{border-color:var(--like)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px}
.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;font-family:inherit;color:var(--ink);text-decoration:none}
.back:hover{border-color:var(--main)}
.clear{margin-left:auto;border:0;background:none;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
.toolbar input,.toolbar select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
.toolbar input{flex:1;min-width:180px}
.count{color:var(--sub);font-size:14px;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.card h3{margin:0;font-size:18px;padding-right:44px}
.tag{align-self:flex-start;font-size:12px;background:#fff1de;color:var(--main-d);padding:3px 9px;border-radius:999px}
.desc{margin:0;color:var(--sub);font-size:14px;line-height:1.5;flex:1}
.score{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main)}
.like{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:20px;cursor:pointer;line-height:1;padding:6px 8px;filter:grayscale(1);opacity:.55}
.like:hover{opacity:1}
.like.on{filter:none;opacity:1;border-color:var(--like);background:#eaf2fd}
.card.picked{border-color:var(--like);box-shadow:0 0 0 1px var(--like) inset}
.empty{text-align:center;color:var(--sub);padding:48px 0;grid-column:1/-1}
footer{text-align:center;color:var(--sub);font-size:13px;padding:24px 0 40px}
.cat-card.rank{border-color:var(--main)}
.rk{align-self:flex-start;font-size:13px;font-weight:700;background:#f3ece2;color:var(--sub);padding:3px 10px;border-radius:999px}
.rk.r1{background:#ffd54a;color:#5a4300}
.rk.r2{background:#d9dee5;color:#39424e}
.rk.r3{background:#f0b78a;color:#5c3213}
.home-search{display:flex;gap:8px;margin:4px 0 18px}
.home-search input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;font-family:inherit}
.home-search input:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px rgba(245,138,31,.2)}
.home-search button{padding:0 18px;border:0;border-radius:12px;background:var(--main);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.home-search button:hover{background:var(--main-d)}

</style>

<header>
<h1>🍊 제주 먹거리·특산물</h1>
<p id="lead">카테고리를 고르고, 먹어 보고 싶은 음식에 👍를 눌러 나만의 목록을 만들어 보세요.</p>
</header>
<main>

<!-- 첫 화면 -->
<section id="home">
<form class="home-search" method="get">
<input type="hidden" name="c" value="전체">
<input name="q" type="search" placeholder="이름으로 검색 (예: 갈치)" aria-label="이름으로 검색">
<button type="submit">🔍 검색</button>
</form>
<h2 class="sec-title">보고 싶은 카테고리를 골라 보세요</h2>
<div class="home-grid" id="homeGrid"></div>
</section>

<!-- 목록 화면 -->
<section id="listview" hidden>
<div class="top"><a class="back" href="?">← 처음으로</a><h2 id="title"></h2><button class="clear" id="clear">목록 비우기</button></div>
<div class="toolbar">
<input id="q" type="search" placeholder="이름으로 검색 (예: 갈치)">
<select id="sort">
<option value="high">추천도 높은 순</option>
<option value="low">추천도 낮은 순</option>
<option value="name">이름 가나다순</option>
</select>
</div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
</section>

<footer>추천도는 대표성과 인지도를 기준으로 한 참고값입니다.</footer>
</main>

<script>
const ITEMS = window.JEJU_DATA.items;
const CATS = ['전체','음식','해산물','과일','농산물','음료','디저트','기념품·가공식품'];
const ICON = {'전체':'🍊','음식':'🍜','해산물':'🐟','과일':'🍋','농산물':'🥕','음료':'🍵','디저트':'🍨','기념품·가공식품':'🎁'};
const KEY = 'jeju_foods_selected';
let picked = new Set();
try { picked = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
function savePicked() { try { localStorage.setItem(KEY, JSON.stringify([...picked])); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const cParam = params.get('c');

if (cParam === null) {
  // ── 첫 화면 ──
  const n = c => c === '전체' ? ITEMS.length : ITEMS.filter(i => i.category === c).length;
  $('homeGrid').innerHTML = CATS.map(c =>
    `<a class="cat-card" href="?c=${encodeURIComponent(c)}"><span class="ico">${ICON[c]}</span><b>${esc(c)}</b><span class="n">${n(c)}개</span></a>`).join('')
    + `<a class="cat-card rank" href="?c=__rank"><span class="ico">🏆</span><b>추천도 순위</b><span class="n">높은 순 ${ITEMS.length}개</span></a>`
    + `<a class="cat-card wish" href="?c=__wish"><span class="ico">👍</span><b>내 목록</b><span class="n">${picked.size}개 담음</span></a>`;
} else {
  // ── 목록 화면 ──
  $('home').hidden = true; $('listview').hidden = false; $('lead').hidden = true;
  let view = cParam;
  if (view !== '__wish' && view !== '__rank' && !CATS.includes(view)) view = '전체';
  var q = params.get('q') || '', sort = 'high';
  $('q').value = q;
  document.title = (view === '__wish' ? '내 목록' : view === '__rank' ? '추천도 순위' : view) + ' · 제주 먹거리·특산물';
  $('title').textContent = view === '__wish' ? '👍 내 목록' : view === '__rank' ? '🏆 추천도 순위' : ICON[view] + ' ' + view;
  if (view === '__rank') { sort = 'high'; $('sort').style.display = 'none'; }
  // 추천도 순위(동점이면 같은 순위)
  const RANK = {};
  [...ITEMS].sort((a, b) => b.score - a.score).forEach((i, idx, arr) => { RANK[i.name] = idx > 0 && arr[idx - 1].score === i.score ? RANK[arr[idx - 1].name] : idx + 1; });

  function render() {
    $('clear').style.display = view === '__wish' && picked.size ? '' : 'none';
    const list = ITEMS.filter(i => {
      if (view === '__wish') { if (!picked.has(i.name)) return false; }
      else if (view !== '전체' && view !== '__rank' && i.category !== view) return false;
      return i.name.toLowerCase().includes(q.trim().toLowerCase());
    });
    list.sort((a, b) => sort === 'high' ? b.score - a.score : sort === 'low' ? a.score - b.score : a.name.localeCompare(b.name, 'ko'));
    $('count').textContent = `${list.length}개 항목`;
    $('grid').innerHTML = list.length ? list.map(i => {
      const on = picked.has(i.name);
      return `<article class="card ${on ? 'picked' : ''}">
        ${view === '__rank' ? `<span class="rk r${RANK[i.name] <= 3 ? RANK[i.name] : 0}">${RANK[i.name]}위</span>` : ''}
        <button class="like ${on ? 'on' : ''}" data-n="${esc(i.name)}" aria-label="내 목록 담기/빼기" title="${on ? '내 목록에서 빼기' : '내 목록에 담기'}">👍</button>
        <h3>${esc(i.name)}</h3><span class="tag">${esc(i.category)}</span>
        <p class="desc">${esc(i.description)}</p>
        <div class="score"><span>추천도 ${i.score}</span><div class="bar"><i style="width:${i.score}%"></i></div></div>
      </article>`;
    }).join('') : `<div class="empty">${view === '__wish' ? '아직 담은 항목이 없어요. 다른 카테고리에서 👍를 눌러 보세요.' : '검색 결과가 없습니다.'}</div>`;
  }
  $('grid').addEventListener('click', e => {
    const b = e.target.closest('.like'); if (!b) return;
    const nm = b.dataset.n;
    picked.has(nm) ? picked.delete(nm) : picked.add(nm); savePicked(); render();
  });
  $('clear').addEventListener('click', () => { picked.clear(); savePicked(); render(); });
  $('q').addEventListener('input', e => { q = e.target.value; render(); });
  $('sort').addEventListener('change', e => { sort = e.target.value; render(); });
  render();
}
</script>
